name: Monthly Report

on:
  schedule:
    # ساعت ۰۸:۰۰ UTC روز اول هر ماه
    - cron: "0 8 1 * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: live-signals-runner
  cancel-in-progress: false

jobs:
  monthly-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build config.yaml from secrets
        run: |
          cp config.example.yaml config.yaml
          python - <<'PY'
          import yaml, os
          with open("config.yaml") as f:
              cfg = yaml.safe_load(f)
          cfg["telegram"]["bot_token"] = os.environ["TELEGRAM_BOT_TOKEN"]
          cfg["telegram"]["chat_id"] = os.environ["TELEGRAM_CHAT_ID"]
          with open("config.yaml", "w") as f:
              yaml.safe_dump(cfg, f, allow_unicode=True)
          PY
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Run monthly report
        run: python -m reports.monthly_report

      - name: Commit report file
        run: |
          git config user.name "trading-bot"
          git config user.email "bot@users.noreply.github.com"
          git add results/reports/*.csv results/live/telegram_topics.json || true
          git diff --quiet --cached || git commit -m "chore: monthly report [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git push
